  Background of the window that opens when the DMG is mounted. Source of
  background.tiff: render it with create-dmg-background.sh after changing it.
  The layout must match the icon positions in Eclipse INCEpTION-dmg-setup.scpt:
  application (200, 268), Applications (440, 268), legal (100, 405), all at 96 px. The
  window is taller than the icons need: Finder shows a scrollbar unless the lowest
  label has some room below it.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="530" viewBox="0 0 640 530">
  <title>Eclipse INCEpTION installer window background</title>
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171848"/>
      <stop offset="0.34" stop-color="#2c2f80"/>
      <stop offset="0.66" stop-color="#2c2f80"/>
      <stop offset="1" stop-color="#171848"/>
    </linearGradient>
    <radialGradient id="glow" cx="320.0" cy="176" r="220.0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.30"/>
      <stop offset="0.3" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="176" x2="0" y2="530" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e4e6f3"/>
      <stop offset="1" stop-color="#fbfbfe"/>
    </linearGradient>
  </defs>

  <!-- Lower area: light, so that the icon labels Finder draws stay readable -->
  <rect width="640" height="530" fill="url(#floor)"/>

  <!-- Top band in the colours of the splash screen -->
  <rect width="640" height="176" fill="url(#band)"/>
  <rect width="640" height="176" fill="url(#glow)"/>
  <rect y="174" width="640" height="2" fill="#F78D2C"/>

