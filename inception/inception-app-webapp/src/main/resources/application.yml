# ===================================================================
# INCEpTION Properties
# ===================================================================

# See properties classes for default values

# ===================================================================
# Spring Boot Properties
# ===================================================================

# IDENTITY (ContextIdApplicationContextInitializer)
spring:
  application:
    name: INCEpTION

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  web:
    resources:
      cache:
        cachecontrol:
          max-age: 31536000
    error:
      whitelabel:
        enabled: false
      path: /whoops

  datasource:
    url: ${database.url:${INCEPTION_DB_URL:jdbc:hsqldb:file:${inception.home:${user.home}/.inception}/db/inception;hsqldb.default_table_type=cached;hsqldb.tx=mvcc}}
    username: ${database.username:${INCEPTION_DB_USERNAME:sa}}
    password: ${database.password:${INCEPTION_DB_PASSWORD:}}
    driver-class-name: ${database.driver:${INCEPTION_DB_DRIVER:}}

  jpa:
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        dialect: ${database.dialect:${INCEPTION_DB_DIALECT:}}
        generate_statistics: false
        # Enable SQL statements formatting.
        # format_sql: true
        # jmx:
        #   enabled: true
    hibernate:
      ddl-auto: validate
      naming:
        # Fix @Column(name="...")
        # https://github.com/spring-projects/spring-boot/issues/2129
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    analytics-enabled: false

server:
  # Use the forward-header handling of the embedded Tomcat - usually works best
  forward-headers-strategy: NATIVE
  servlet:
    session:
      cookie:
        same-site: strict

wicket:
  core:
    settings:
      markup:
        default-markup-encoding: UTF-8
        strip-comments: true
        compress-whitespace: true
  web:
    servlet:
      dispatcher-types: request, error, async, forward
      init-parameters:
        ignorePaths: /api,/saml2
  verifier:
    dependencies:
      throw-exception-on-dependency-version-mismatch: false

springdoc:
  # Tie the OpenAPI/Swagger endpoints to the remote API: when remote-api is on,
  # SpringDoc serves the docs; when it's off, both endpoints are disabled. Setting
  # these explicitly also suppresses SpringDoc's "enabled by default" startup warning.
  api-docs:
    enabled: ${remote-api.enabled:${webanno.remote-api.enable:false}}
  swagger-ui:
    enabled: ${remote-api.enabled:${webanno.remote-api.enable:false}}
    tagsSorter: alpha
