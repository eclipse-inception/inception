mesh:
  name: Medical Subject Headings (MeSH)
  type: REMOTE
  default-language: en
  # The endpoint hosts the current release as well as one named graph per year. Restricting the
  # queries to the current-release graph avoids getting the same descriptor back once per year.
  default-dataset: http://id.nlm.nih.gov/mesh
  # The MeSH ontology/schema - including the rdfs:label sub-property declarations for
  # meshv:prefLabel and meshv:altLabel - lives in a separate vocab graph. We include it so those
  # declarations are visible to queries (the per-year duplication concern only affects the
  # descriptor data graphs, not the schema graph).
  additional-datasets:
    - http://id.nlm.nih.gov/mesh/vocab
  access:
    access-url: https://id.nlm.nih.gov/mesh/sparql
    full-text-search: bif:contains
  mapping:
    # MeSH descriptors are instances of meshv:TopicalDescriptor and form their hierarchy via
    # meshv:broaderDescriptor (not rdfs:subClassOf), so we use that as the "subclass" relation -
    # analogous to how the SKOS-based thesauri use skos:broader.
    class: http://id.nlm.nih.gov/mesh/vocab#TopicalDescriptor
    subclass-of: http://id.nlm.nih.gov/mesh/vocab#broaderDescriptor
    instance-of: http://www.w3.org/1999/02/22-rdf-syntax-ns#type
    label: http://www.w3.org/2000/01/rdf-schema#label
    description: http://id.nlm.nih.gov/mesh/vocab#scopeNote
    property-type: http://www.w3.org/1999/02/22-rdf-syntax-ns#Property
    subproperty-of: http://www.w3.org/2000/01/rdf-schema#subPropertyOf
    property-label: http://www.w3.org/2000/01/rdf-schema#label
    property-description: http://www.w3.org/2000/01/rdf-schema#comment
    deprecation-property: http://www.w3.org/2002/07/owl#deprecated
  # MeSH descriptors carry their name in rdfs:label, but term (T...) and concept (M...) nodes carry
  # it only in meshv:prefLabel (and synonyms in meshv:altLabel). Both are declared as rdfs:label
  # sub-properties in the vocab graph (included via additional-datasets above), so they are resolved
  # automatically via the sub-property hierarchy - no explicit additional-matching-properties needed.
  info:
    description: |
      Medical Subject Headings (MeSH) is the U.S. National Library of Medicine's controlled
      vocabulary thesaurus used for indexing articles for PubMed. It provides a hierarchically
      organized terminology of descriptors covering diseases, chemicals and drugs, anatomy,
      organisms and other biomedical concepts.

      This profile queries the current MeSH release served from the NLM SPARQL endpoint, which is
      backed by OpenLink Virtuoso.

      Tip: MeSH descriptors, concepts and terms all carry the same names, so by default the
      concept auto-complete also offers concept (M...) and term (T...) nodes. To restrict it to
      the canonical descriptors (the entities with a place in the MeSH hierarchy), set the concept
      feature's "Allowed values" to "concepts only" in the feature settings.

      Find out more at [https://www.nlm.nih.gov/mesh/](https://www.nlm.nih.gov/mesh/).

      **Terms of use and attribution:** The following summary was taken from the
      [NLM terms and conditions](https://www.nlm.nih.gov/databases/download/terms_and_conditions.html)
      in November 2026. It is provided for convenience only and may be out of date. Please
      consult that page for the current terms, which take precedence over this summary.

      At the time of writing, users of NLM data agree to acknowledge NLM as the source of the
      data by including the phrase "Courtesy of the U.S. National Library of Medicine" in a
      clear and conspicuous manner, and not to indicate or imply that NLM has endorsed their
      products, services or applications. Users who republish or redistribute the data must
      keep it current or state clearly that it does not reflect the most recent version.
    host-institution-name: U.S. National Library of Medicine (NLM)
    author-name: U.S. National Library of Medicine (NLM)
    website-url: https://www.nlm.nih.gov/mesh/
    license-name: NLM Terms and Conditions
    license-url: https://www.nlm.nih.gov/databases/download/terms_and_conditions.html

snomed-ct:
  name: SNOMED Clinical Terms (manual steps required!)
  type: LOCAL
  default-language: en
  base-prefix: http://snomed.info/id/
  access:
    full-text-search: http://www.openrdf.org/contrib/lucenesail#matches
  mapping:
    class: http://www.w3.org/2002/07/owl#Class
    subclass-of: http://www.w3.org/2000/01/rdf-schema#subClassOf
    instance-of: http://www.w3.org/1999/02/22-rdf-syntax-ns#type
    description: http://www.w3.org/2004/02/skos/core#definition
    label: http://www.w3.org/2004/02/skos/core#prefLabel
    property-type: http://www.w3.org/1999/02/22-rdf-syntax-ns#Property
    subproperty-of: http://www.w3.org/2000/01/rdf-schema#subPropertyOf
    property-label: http://www.w3.org/2000/01/rdf-schema#label
    property-description: http://www.w3.org/2000/01/rdf-schema#comment
    deprecation-property: http://www.w3.org/2002/07/owl#deprecated
  root-concepts:
    - http://snomed.info/id/138875005
  additional-matching-properties:
    - http://www.w3.org/2004/02/skos/core#altLabel
    - http://www.w3.org/2000/01/rdf-schema#label
  info:
    description: |
      SNOMED CT is a systematically organized collection of medical terms providing codes, terms, synonyms and 
      definitions used in clinical documentation and reporting.

      **Note: Manual steps are required.** Choosing this profile will **not automatically download** and install the resources.

      **License:** SNOMED CT is not freely licensed. You need a license to use it: in SNOMED
      International member countries this is usually provided through the National Release
      Center (in the USA, through the NLM's UMLS license), elsewhere through an Affiliate
      License from SNOMED International. Please consult [SNOMED International](https://www.snomed.org/get-snomed)
      for the terms that apply to you.

      Here is what you need to do to obtain and load the actual SNOMED CT data:
      
      - Download SNOMED CT RD2 data files, e.g. from the [National Library of Medicine](https://www.nlm.nih.gov/healthit/snomedct/international.html)
      - Use the [snomed-owl-toolkit](https://github.com/IHTSDO/snomed-owl-toolkit) to convert the RD2 data to  _OWL Functional Syntax_.
      - Rename the `.owl` file produced by the snomed-owl-toolkit to end in `.ofn`.
      - Import the renamed file into the knowledge base created from this profile (this may take a while)
      
      At this point, you will be able to link against SNOMED concepts, but the tree browser will not be able to find
      certain concepts. To fix this, an additional step has to be performed:
      
      - Obtain a copy for the [ELK Reasoner standalone executable](https://github.com/liveontologies/elk-reasoner/releases)
      - Use ELK to classify the SNOMED _OWL Functional Syntax_ data: <br>
        `java -jar elk-standalone.jar -i snomed-file.ofn -c -o snomed-classified-file.ofn`
      - Import that converted classified file into same knowledge base that already contains the other SNOMED data
      
      After all imports are complete, enable the _read only_ checkbox - this enables an internal cache and improves performance.
    host-institution-name: SNOMED International
    website-url: https://www.snomed.org
    license-name: SNOMED CT Affiliate License
    license-url: https://www.snomed.org/get-snomed
