      The Integrated Authority File (GND) is an authority file for persons, corporate bodies,
      conferences, geographic names, subject headings and works, maintained by the German
      National Library (DNB) together with the German-speaking library networks. It is mainly
      used for cataloguing and indexing in libraries.

      This profile queries a copy of the GND hosted by ZBW - Leibniz Information Centre for
      Economics.

      **License:** According to the license statements in the GND data, as checked in
      November 2026, the GND is released by the DNB under the CC0 1.0 public domain dedication.
      This may have changed since; please consult the DNB for the current terms.
    host-institution-name: ZBW - Leibniz Information Centre for Economics
    author-name: German National Library (DNB) and the GND network
    website-url: https://www.dnb.de/EN/Professionell/Standardisierung/GND/gnd_node.html
    license-name: CC0 1.0
    license-url: https://creativecommons.org/publicdomain/zero/1.0/
  root-concepts:
    - https://d-nb.info/standards/elementset/gnd#AuthorityResource


