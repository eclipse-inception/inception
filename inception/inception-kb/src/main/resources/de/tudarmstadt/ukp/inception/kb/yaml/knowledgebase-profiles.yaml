    property-label: http://www.w3.org/2000/01/rdf-schema#label
    property-description: http://www.w3.org/2000/01/rdf-schema#comment
    subproperty-of: http://www.w3.org/2000/01/rdf-schema#subPropertyOf
    deprecation-property: http://www.w3.org/2002/07/owl#deprecated
  info:
    description: |
      YAGO is a large knowledge base with general knowledge about people, cities, countries,
      movies, and organizations. Since version 4 it is derived from Wikidata and uses the
      schema.org taxonomy; earlier versions were derived from Wikipedia, WordNet and GeoNames.

      **License and attribution:** According to the [YAGO website](https://yago-knowledge.org/),
      as checked in November 2026, YAGO is licensed under the Creative Commons Attribution 4.0
      International license (CC BY 4.0), which requires that you give appropriate credit, link
      to the license and indicate any changes. This summary may be out of date; please consult
      the YAGO website for the current terms, which take precedence over this summary.
