# ##################################################################################################
#
# KNOWLEDGE BASE PROFILE DEFINITIONS
# ==================================
#
# This file contains knowledge base profiles. The file is organized into two sections:
#
# 1) profiles for REMOTE knowledge bases
# 2) profiles for LOCAL knowledge bases
#
# Within each section, the profiles are ordered alphabetically accoring to their ID.
#
# ##################################################################################################

# ##################################################################################################
#
# PROFILES FOR REMOTE KNOWLEDGE BASES
#
# ##################################################################################################
agrovoc:
  name: AGROVOC Thesaurus
  type: REMOTE
  default-language: en
  access:
    access-url: https://agrovoc.fao.org/sparql
    full-text-search: text:query
  mapping:
    class: http://www.w3.org/2004/02/skos/core#Concept
    subclass-of: http://www.w3.org/2004/02/skos/core#broader
    instance-of: http://www.w3.org/1999/02/22-rdf-syntax-ns#type
    label: http://www.w3.org/2004/02/skos/core#prefLabel
    description: http://www.w3.org/2000/01/rdf-schema#comment
    property-type: http://www.w3.org/1999/02/22-rdf-syntax-ns#Property
    subproperty-of: http://www.w3.org/2000/01/rdf-schema#subPropertyOf
    property-label: http://www.w3.org/2004/02/skos/core#prefLabel
    property-description: http://www.w3.org/2000/01/rdf-schema#comment
    deprecation-property: http://www.w3.org/2002/07/owl#deprecated
  additional-matching-properties:
    - http://www.w3.org/2004/02/skos/core#altLabel
  info:
    description: |
      AGROVOC is a multilingual and controlled vocabulary designed to cover concepts and 
      terminology under FAO's areas of interest. It is the largest Linked Open Data set 
      about agriculture available for public use and its greatest impact is through providing 
      the access and visibility of data across domains and languages.

      It offers a structured collection of agricultural concepts, terms, definitions and 
      relationships which are used to unambiguously identify resources, allowing standardized 
      indexing processes and making searches more efficient. The thesaurus is hierarchically 
      organized under 25 top concepts.

      AGROVOC uses semantic web technologies, linking to other multilingual knowledge 
      organization systems and building bridges between datasets. AGROVOC is edited using 
      VocBench 3, a web-based vocabulary management tool.

      For more information, please consult <http://www.fao.org/agrovoc/>.
      
      Source: <https://agrovoc.fao.org/browse/en/about>
    host-institution-name: Food and Agriculture Organization (FAO) of the United Nations
    author-name: Food and Agriculture Organization (FAO) of the United Nations
    website-url: http://www.fao.org/agrovoc/
  # The 25 documented top concepts (skos:topConceptOf). Pinning them avoids the expensive and
  # highly variable "concepts without a broader parent" enumeration that would otherwise be run
  # to discover the roots dynamically. This set is identical to what that enumeration returns.
  root-concepts:
    - http://aims.fao.org/aos/agrovoc/c_330834   # activities
    - http://aims.fao.org/aos/agrovoc/c_330892   # entities
    - http://aims.fao.org/aos/agrovoc/c_330979   # events
    - http://aims.fao.org/aos/agrovoc/c_331093   # factors
    - http://aims.fao.org/aos/agrovoc/c_331061   # features
    - http://aims.fao.org/aos/agrovoc/c_50227    # groups
    - http://aims.fao.org/aos/agrovoc/c_330988   # location
    - http://aims.fao.org/aos/agrovoc/c_330493   # measure
    - http://aims.fao.org/aos/agrovoc/c_4788     # methods
    - http://aims.fao.org/aos/agrovoc/c_330919   # objects
    - http://aims.fao.org/aos/agrovoc/c_49904    # organisms
    - http://aims.fao.org/aos/agrovoc/c_330704   # phenomena
    - http://aims.fao.org/aos/agrovoc/c_13586    # processes
    - http://aims.fao.org/aos/agrovoc/c_6211     # products
    - http://aims.fao.org/aos/agrovoc/c_49874    # properties
    - http://aims.fao.org/aos/agrovoc/c_9001017  # resources
    - http://aims.fao.org/aos/agrovoc/c_331000   # site
    - http://aims.fao.org/aos/agrovoc/c_330995   # stages
    - http://aims.fao.org/aos/agrovoc/c_330998   # state
    - http://aims.fao.org/aos/agrovoc/c_330991   # strategies
    - http://aims.fao.org/aos/agrovoc/c_330829   # subjects
    - http://aims.fao.org/aos/agrovoc/c_330705   # substances
    - http://aims.fao.org/aos/agrovoc/c_330985   # systems
    - http://aims.fao.org/aos/agrovoc/c_7644     # technology
    - http://aims.fao.org/aos/agrovoc/c_7778     # time

dblp:
  name: DBLP Computer Science Bibliography
  type: REMOTE
  # No default language: the bibliographic literals (author names, titles) are untagged, while the
  # schema labels (e.g. for the Creator/Publication classes) carry an "en" tag. Leaving the language
  # unconstrained matches both. It also avoids a LANG()-based FILTER inside the OPTIONAL label lookup
  # which is pathologically slow on the QLever-backed endpoint.
  access:
    access-url: https://sparql.dblp.org/sparql
    full-text-search: http://qlever.cs.uni-freiburg.de/builtin-functions/contains-word
  mapping:
    class: http://www.w3.org/2000/01/rdf-schema#Class
    subclass-of: http://www.w3.org/2000/01/rdf-schema#subClassOf
    instance-of: http://www.w3.org/1999/02/22-rdf-syntax-ns#type
    label: http://www.w3.org/2000/01/rdf-schema#label
    property-type: http://www.w3.org/1999/02/22-rdf-syntax-ns#Property
    description: http://www.w3.org/2000/01/rdf-schema#comment
    property-label: http://www.w3.org/2000/01/rdf-schema#label
    property-description: http://www.w3.org/2000/01/rdf-schema#comment
    subproperty-of: http://www.w3.org/2000/01/rdf-schema#subPropertyOf
    deprecation-property: http://www.w3.org/2002/07/owl#deprecated
  info:
    description: |
      The dblp computer science bibliography provides open bibliographic information on major
      computer science journals and proceedings, indexing millions of publications and their
      authors.

      This profile connects to the official dblp SPARQL endpoint, which is powered by the QLever
      engine and provides a full-text index built over the bibliographic literals (publication
      labels/titles and the author names embedded in them). Full-text search therefore matches
      publications and persons by name via QLever's ql:contains-entity / ql:contains-word
      predicates.

      For more information, please consult <https://blog.dblp.org/2024/09/09/introducing-our-public-sparql-query-service/>.
    host-institution-name: Schloss Dagstuhl - Leibniz Center for Informatics / University of Trier
    author-name: dblp team
    website-url: https://dblp.org
  root-concepts:
    - https://dblp.org/rdf/schema#Publication
    - https://dblp.org/rdf/schema#Creator

